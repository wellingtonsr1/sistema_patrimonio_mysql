# ============================================================================
# Alembic — Migrações de schema (feature 052)
# A URL de conexão NÃO vive aqui: env.py lê app.config.DATABASE_URL (fonte
# única, mesma do app). Este arquivo existe para o CLI (`alembic upgrade head`)
# e para a config de logging do próprio CLI.
# ============================================================================

[alembic]
script_location = %(here)s
# sobrescrita em env.py — mantida vazia de propósito
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
